<!doctype html>
<html lang="pt-BR">

  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0" />
    <title>Mentoria Educacional Universitária - AMF</title>
    <meta name="description" content="Mentoria educacional gratuita para universitários da AMF. Apoio acadêmico, orientação profissional e bem-estar emocional com a Prof. Patrícia Dias." />
    <meta name="keywords" content="mentoria educacional, apoio acadêmico, orientação universitária, AMF, Antonio Meneghetti Faculdade, desenvolvimento pessoal, orientação profissional, bem-estar emocional, estudantes universitários" />
    <link rel="icon" type="image/webp" href="/images/logo.webp" />
    
    <!-- Critical CSS inline para eliminar render-blocking -->
    <style>
      /* CSS crítico dentro de @layer base: aparece antes do Tailwind e não sobrepõe suas classes */
      @layer base{
      /* Reset e base críticos */
      *,*::before,*::after{box-sizing:border-box;border-width:0;border-style:solid}
      html{line-height:1.5;-webkit-text-size-adjust:100%;font-family:"Atkinson Hyperlegible Next",system-ui,sans-serif}
      body{margin:0;line-height:inherit;background-color:#F2B84B;color:#101D33}
      img,video{max-width:100%;height:auto;display:block}
      
      /* Variáveis críticas */
      :root{--ouro:#F2B84B;--noite:#101D33}
      
      /* Container crítico */
      .container{width:100%;margin-left:auto;margin-right:auto;padding-left:1rem;padding-right:1rem}
      @media(min-width:1024px){.container{padding-left:2rem;padding-right:2rem;max-width:1280px}}
      
      /* Tipografia crítica */
      h1,h2,h3{font-family:"Bricolage Grotesque",system-ui,sans-serif;font-weight:700}
      
      /* Loading state */
      #root:empty{display:flex;align-items:center;justify-content:center;min-height:100vh}
      #root:empty::after{content:"";width:40px;height:40px;border:3px solid #101D3326;border-top-color:#101D33;border-radius:50%;animation:spin 1s linear infinite}
      @keyframes spin{to{transform:rotate(360deg)}}
      }
    </style>
    
    <!-- Preconnect hints for performance - ordem otimizada -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="dns-prefetch" href="https://calendly.com" />
    
    <!-- Preload da imagem principal (retrato da mentora no topo) -->
    <link rel="preload" as="image" href="/images/mentora-patricia-perfil.webp" fetchpriority="high" />
    
    <!-- Fontes: Bricolage Grotesque (títulos) + Atkinson Hyperlegible Next (texto, feita para leitura acessível) -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,500..800&display=swap" />
    <meta name="theme-color" content="#101D33" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>

</html>
